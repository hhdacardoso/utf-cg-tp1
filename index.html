<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8" />
        <title>Trabalho Prático 1 - Computação Gráfica</title>
        <link rel="stylesheet" href="index.css" type="text/css" />
    </head>
    <body>
        <canvas id="glcanvas" width="680" height="680"></canvas>
    </body>

    <script type="shader/vertex">
        #version 300 es

        in vec3 coordinates;
        in float pointSize;

        void main(){
            gl_Position = vec4(coordinates, 1.0);
            gl_PointSize = pointSize;
        }
    </script>

    <script type="shader/fragment">
        #version 300 es

        precision mediump float;
        out vec4 FragColor;

        void main(){
            FragColor = vec4(1.0, 1.0, 1.0, 1.0);
        }
    </script>

    <script type="module">
        import {drawPoint, setupWebGL, initialize, updatePos, render} from "/main.js"
        const gl = setupWebGL();
        const program = initialize(gl);
        
        let lastUpdate = {valor: 0};

        const posList = [
            [0.9, 0.9, 0.9],
            [0.75, 0.75, 0.75],
            [0.5, 0.5, 0.5],
            [0.25, 0.25, 0.25],
            [0.0, 0.0, 0.0]
        ];
        let posIndex = {valor: 0};
        
        let vertices = new Float32Array([0.0, 0.0, 0.0,
                                         ...posList[0]]);
            
        requestAnimationFrame((timeStamp) =>
            render(timeStamp, lastUpdate, posIndex, posList, vertices, gl, program));

        // requestAnimationFrame(renderFun);
    </script>
</html>
