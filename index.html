<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8" />
        <title>Trabalho Prático 1 - Computação Gráfica</title>
        <link rel="stylesheet" href="index.css" type="text/css" />
    </head>
    <body>
        <canvas id="glcanvas" width="680" height="680"></canvas>
    </body>

    <script type="shader/vertex">
        #version 300 es

        in vec3 coordinates;
        in float pointSize;

        void main(){
            gl_Position = vec4(coordinates, 1.0);
            gl_PointSize = pointSize;
        }
    </script>

    <script type="shader/fragment">
        #version 300 es

        precision mediump float;
        out vec4 FragColor;

        void main(){
            FragColor = vec4(1.0, 1.0, 1.0, 1.0);
        }
    </script>

    <script type="module">
        import {drawPoint, setupWebGL, initialize} from "/main.js"
        const gl = setupWebGL();
        const program = initialize(gl);
        
        let lastUpdate = 0;
        const interval = 1000; // Intervalo em ms para update da posição
        
        let vertices = new Float32Array([0.0, 0.0, 0.0,
                                         0.5, 0.5, 0.5]);
                                         
        function updatePos(){
            const x = Math.random() * 2 - 1;
            const y = Math.random() * 2 - 1;
            vertices[3] = x;
            vertices[4] = y;
            }
            
            function render(timeStamp){
            if (timeStamp - lastUpdate > interval){
                updatePos();
                lastUpdate = timeStamp;
            }
            drawPoint(gl, program, vertices);
            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</html>
