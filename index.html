<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8" />
        <title>Trabalho Prático 1 - Computação Gráfica</title>
        <link rel="stylesheet" href="index.css" type="text/css" />
    </head>
    <body>
        <canvas id="glcanvas" width="680" height="680"></canvas>
    </body>

    <script type="shader/vertex">
        #version 300 es

        attribute vec3 coordinates;

        void main(){
            gl_Position = vec4(coordinates, 1.0);
            gl_PointSize = 10.0;
        }

    </script>

    <script type="shader/fragment">
        #version 300 es

        precision highp float;
        uniform vec4 objectColor;
        out vec4 outColor;

        void main(){
            outColor = objectColor;
        }
    </script>

    <script src="main.js"></script>
</html>
