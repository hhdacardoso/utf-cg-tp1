<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8" />
        <title>Trabalho Prático 1 - Computação Gráfica</title>
        <link rel="stylesheet" href="index.css" type="text/css" />
    </head>
    <body>
        <main class="game-container">
            <canvas id="glcanvas" width="680" height="680"></canvas>
            <section class="health-display" aria-label="Vida da torre">
                <div class="health-bar">
                    <div id="tower-health" class="health-bar-fill"></div>
                    <span id="tower-health-text" class="health-bar-text">1500</span>
                </div>
            </section>
            <section id="menu" class="menu" aria-label="Menu principal">
                <h1>Tower Defense</h1>
                <button id="start-button" type="button">Iniciar</button>
            </section>
            <section id="game-over-menu" class="menu" aria-label="Fim de jogo" hidden>
                <h1>GAME OVER</h1>
                <button id="restart-button" type="button">Reiniciar</button>
            </section>
        </main>
    </body>

    <script type="shader/vertex">
        #version 300 es

        in vec2 position;
        uniform mat4 u_projection;
        uniform mat4 u_model;

        void main(){
            gl_Position = u_projection * u_model * vec4(position, 0.0, 1.0);
        }
    </script>

    <script type="shader/fragment">
        #version 300 es

        precision highp float;
        out vec4 outColor;
        uniform vec4 u_color;

        void main(){
            outColor = u_color;
        }
    </script>

    <script type="module">
        import {setupWebGL, initialize, render, resizeCanvas} from "./main.js";
        import {createGameLoop, createGameState, handleCanvasClick, states} from "./game_state.js";
        import { mat4 } from "https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/esm/index.js";

        let lastTime = 0;
        let entities = [
            {type: "torre",
                x:0, y:0,
                hp:1500,
                maxHp:1500,
                color: [0.2, 0.6, 1.0, 1.0],
                scale: 0.3,
                dano: 5,
                clickDamage: 5,
                attackRange: 1.0,
                attackInterval: 0.4,
                attackCooldown: 0,
                projectileSpeed: 2.0,
                modelMatrix: mat4.create(),
            }
        ]

        const {gl, canvas} = setupWebGL();
        
        resizeCanvas(gl, canvas);
        window.addEventListener("resize", () => resizeCanvas(gl, canvas));

        const program = initialize(gl);
        console.log("modelLocation:", program.modelLocation);
        console.log("projectionLocation:", program.projectionLocation);
        console.log("colorLocation:", program.colorLocation);
        console.log("program:", program.program);

        // Inicia o jogo no MENU
        const stateAtual = createGameState();
        const menu = document.querySelector("#menu");
        const startButton = document.querySelector("#start-button");
        const gameOverMenu = document.querySelector("#game-over-menu");
        const restartButton = document.querySelector("#restart-button");
        const towerHealth = document.querySelector("#tower-health");
        const towerHealthText = document.querySelector("#tower-health-text");

        stateAtual.onUpdate = torre => {
            const healthPercentage = Math.max(0, Math.min(100, (torre.hp / torre.maxHp) * 100));
            towerHealth.style.width = `${healthPercentage}%`;
            towerHealthText.textContent = `${Math.max(0, Math.ceil(torre.hp))}`;
        };

        stateAtual.onGameOver = () => {
            gameOverMenu.hidden = false;
        };

        startButton.addEventListener("click", () => {
            stateAtual.atual = states.JOGANDO;
            menu.hidden = true;
        });

        restartButton.addEventListener("click", () => {
            window.location.reload();
        });

        // Dano nos inimigos ao clicar neles
        canvas.addEventListener("click", event => {
            handleCanvasClick(canvas, event, entities, stateAtual);
        });

        const gameLoop = createGameLoop(gl, program, entities, stateAtual);
        
        requestAnimationFrame(gameLoop);
    </script>
</html>
